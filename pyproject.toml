[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-game-mechanics"
version = "0.1.0"
description = "Tutorial and game mechanics for an ASL learning system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "mediapipe",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["game_mechanics"]
